user nrpuser nrpgroup;
worker_processes 1;

error_log /home/nrpuser/nginx.err;
pid	  /home/nrpuser/nginx.pid;

# [EBR2-95] Lua/NDK modules are not packaged in jammy nginx-extras; dropped (only trivial set_by_lua remained, replaced with a static path).
# load_module modules/ndk_http_module.so;
# load_module modules/ngx_http_lua_module.so;

events {
    worker_connections 1024;
}

env NRP_SIMULATION_DIR;

http {
    default_type    application/octet-stream;
    include         mime.types;
    # [EBR2-95] oauth_cache lua dict was unused under FS auth; dropped with the lua module.

    log_format custom '$remote_addr - $remote_user [$time_local][$msec] '
                      '"$request" $status $body_bytes_sent '
                      '"$upstream_addr" "$http_referer" "$http_user_agent" '
                      '$request_time $upstream_response_time';
    access_log /home/nrpuser/nginx.access.log custom;

    sendfile          on;
    keepalive_timeout 65;
    proxy_connect_timeout       300;
    proxy_send_timeout          300;
    proxy_read_timeout          300;
    send_timeout                300;

    client_max_body_size 2000M;
    client_body_temp_path /tmp;
    proxy_temp_path /tmp;

    include conf.d/*.conf;
}
